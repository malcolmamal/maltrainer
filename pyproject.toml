# Tool configuration only. Dependencies are still in requirements.txt; the quality gate
# (python -m maltrainer_quality) reads the settings below.

[tool.ruff]
target-version = "py310"
# The width the code was written at. 88 would add a quarter more lines, against the 200-line limit.
line-length = 120
# The scripts import their sibling modules (merge_loras, qwen_2_1_sweep_checkpoints) as
# first-party, the same as maltrainer.
src = [".", "scripts"]
# Python only: ruff also formats Markdown, and the docs are written by hand.
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
# Families, added one commit each so the gate passed on every commit. Every ignore below carries its
# reason; the size rules (PLR0912, PLR0915) are covered by the complexity ratchet instead.
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "PIE", "SIM", "RET", "ARG", "PTH", "BLE", "RUF", "N", "PL", "T20", "S", "ERA",
]
ignore = [
    # A named result before `return` documents what a model step produces.
    "RET504",
    # safetensors' safe_open handles have keys() but no `in`; ruff cannot tell them from dicts.
    "SIM118",
    # Strings and messages use the typographic × and – on purpose (e.g. "12 images × 70 epochs").
    "RUF001",
    # `import torch.nn.functional as F` is the PyTorch idiom everywhere.
    "N812",
    # B, N, H, W, C, L name tensor dimensions (batch, tokens, height, ...), as in the papers and ComfyUI.
    "N806",
    # Numeric and training code compares against shapes, ranks and thresholds; a named constant for each
    # would hide the arithmetic.
    "PLR2004",
    # Optional or heavy dependencies (bitsandbytes, prodigy, transformers, PIL) are imported where used.
    "PLC0415",
    # Model constructors and loaders take many options; function size is bounded by the complexity gate.
    "PLR0913",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    # ruff reads "token" / "pad_token" / "trigger_token" in a name as a secret; here they are tokenizer tokens.
    "S105",
    "S106",
    "S107",
    # random is used for sampling noise, timesteps and picks, never for security.
    "S311",
    # The subprocesses run fixed argument lists (git, the trainers), without a shell or user-supplied strings.
    "S603",
    "S607",
]

[tool.ruff.lint.per-file-ignores]
# A package's __init__ imports what it re-exports.
"__init__.py" = ["F401"]
# Tests assert, and compare against sha1 digests they compute themselves.
"tests/**" = ["S101", "S324"]
# os.system("") only switches on ANSI escape handling in the Windows console.
"maltrainer/utils/preview_menu.py" = ["S605"]
# Command-line programs report to the console with print. The library (maltrainer/) logs.
"scripts/**" = ["T201"]
"maltrainer_quality/**" = ["T201"]
"train_*.py" = ["T201"]
"compare_loras.py" = ["T201"]
"check_weights.py" = ["T201"]
"inspect_lora.py" = ["T201"]
# ComfyUI custom nodes: the folder name and INPUT_TYPES / IS_CHANGED(self) are ComfyUI's own API; prints go to its console.
"comfyui-zimage-embedding/**" = ["N999", "N802", "N804", "T201"]

# The complexity gate (maltrainer_quality.complexity) runs C901 at this limit against its
# baseline. C90 is not in `select`, so `ruff check` alone does not fail on the
# functions the baseline allows.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = ["error"]
xfail_strict = true

[tool.mypy]
python_version = "3.10"
# The first step is mypy's defaults: unannotated functions are not checked yet. The baseline in
# maltrainer_quality/baselines/types.json lists the files that still have errors; see typing_gate.py.
# accelerate, bitsandbytes, prodigyopt, safetensors' extras and similar ship no type information.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# The gate's own package is held to --strict from the start.
[[tool.mypy.overrides]]
module = "maltrainer_quality.*"
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_subclassing_any = true
no_implicit_optional = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[tool.coverage.run]
source = ["maltrainer", "maltrainer_quality"]
branch = true

[tool.coverage.report]
# A floor, not a target: raise it whenever tests land, never lower it.
fail_under = 99.6
precision = 2
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']
