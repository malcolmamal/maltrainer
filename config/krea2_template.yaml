# Krea 2 LoRA template -- Automagic3 (train_krea2_lora.py).
#
# Used by the web UI, which fills in the placeholders:
#   [person_to_train]   dataset folder name (also the default trigger word)
#   [comfyui_models]    COMFYUI_MODELS_PATH; the UI finds each file anywhere under the matching subfolder
# For the CLI, copy this file and replace the placeholders yourself.
#
# Recipe sources (docs/krea2-lora-training.md):
#   Fizgig's Krea 2 Automagic setup -- one adaptive rate per module family (attention, MLP,
#     text fusion, I/O), a 16-step sign window, no weight decay, EMA 0.98, every Linear trained
#     including the text-fusion adapter ("under-trained by the usual recipe")
#   musubi-tuner / Fizgig timesteps -- logit-normal with the resolution-dependent krea2 shift,
#     the same curve ComfyUI samples on (shift 1.79 at 512 px)
#   maltrainer's Qwen-Image 2.1 benchmark for the Automagic3 launch point (1e-6) and duration

model:
  # RAW, not Turbo: Turbo is distilled. A bf16 RAW file (krea2_raw_bf16) also works; its block
  # Linears are quantized per row to fp8 on load.
  transformer_path: "[comfyui_models]/diffusion_models/krea2_raw_fp8_scaled.safetensors"
  vae_path: "[comfyui_models]/vae/qwen_image_vae.safetensors"
  text_encoder_path: "[comfyui_models]/text_encoders/qwen3vl_4b_fp8_scaled.safetensors"

dataset:
  path: "datasets/[person_to_train]"
  resolution: 512            # area target; buckets keep each image's aspect on a 16 px grid
  aspect_mode: "bucket"
  trigger: "[person_to_train]"
  default_caption: "a photo of [person_to_train]"
  repeats: 1

lora:
  rank: 16
  alpha: 16
  prefix: "diffusion_model."
  # attn-mlp (224 block Linears) | blocks+txt (+32 text fusion = 256, OneTrainer / ai-toolkit)
  # | all (+ projector + 7 I/O = 264, Fizgig / musubi)
  targets: "all"
  dtype: "float32"

train:
  batch_size: 1
  gradient_accumulation_steps: 1
  # Duration: max_steps (> 0) wins; otherwise num_epochs full epochs.
  max_steps: 0               # 0 = train num_epochs full epochs
  num_epochs: 70
  save_every: 200
  timestep_distribution: "krea2_shift"
  max_grad_norm: 1.0
  optimizer: "automagic3"
  learning_rate: 1.0e-6           # Automagic3 launch point; it adapts from here
  weight_decay: 0.0
  automagic_param_groups: true    # attention / MLP / text fusion / I/O each adapt their own rate
  automagic_polarity_history: 16
  automagic_clip_threshold: 1.0
  automagic_beta2: 0.999
  automagic_eps: 1.0e-30
  ema_decay: 0.98                 # checkpoints save the average
  # RAW samples with CFG against a negative prompt; an empty-prompt step now and then keeps the
  # LoRA's unconditional branch in step (ai-toolkit, and maltrainer's FLUX.3 / MOSS-Image templates).
  caption_dropout: 0.05
  # DOP, differential output preservation (ai-toolkit; the base of Fizgig's LoRA Isolation).
  # Each step also runs the caption with the trigger replaced by dop_class ("a photo of
  # feliciaday" -> "a photo of woman") on the same noised latent, and holds the LoRA's prediction
  # there to the base model's. Without the trigger the LoRA learns to change nothing, so the
  # likeness stays off other people. A caption without the trigger gets no DOP pass.
  # About 2x the step time; dop_every 2 halves the extra cost (Fizgig: every 2nd step at weight 2).
  dop: false
  dop_class: "woman"
  dop_multiplier: 1.0
  dop_every: 1

dtype: "bfloat16"
mixed_precision: "bf16"
seed: 42

output:
  path: "./output/krea2/[person_to_train]"
  name: "krea2_[person_to_train]"
  dtype: "bfloat16"
  embed_config: true

logging:
  level: "INFO"
