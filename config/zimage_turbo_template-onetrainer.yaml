# Z-Image Turbo LoRA Training Configuration (based on OneTrainer preset)

# Model configuration
model:
  name_or_path: "ostris/Z-Image-De-Turbo"  # de-distilled transformer
  extras_name_or_path: "Tongyi-MAI/Z-Image-Turbo"  # text encoder + VAE

# LoRA configuration
lora:
  prefix: "diffusion_model."
  rank: 16
  alpha: 1
  target_modules:
    - "to_q"
    - "to_k"
    - "to_v"
    - "to_out.0"
    - "feed_forward.w1"
    - "feed_forward.w2"
    - "feed_forward.w3"
    - "adaLN_modulation.0"

# Dataset configuration
dataset:
  path: "C:/Development/projects/maltrainer/datasets/[person_to_train]"
  trigger: "sks woman"
  default_caption: "photo of a woman"
  repeats: 1
  resolution: 512
  center_crop: true
  random_flip: false
  num_workers: 1

# Training configuration
train:
  batch_size: 2
  gradient_accumulation_steps: 1
  num_epochs: 100
  optimizer: "adamw"
  learning_rate: 3e-4
  learning_rate_warmup_steps: 200
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1e-8
  weight_decay: 0.01
  weight_decay_exclude_lora: true
  timestep_distribution: "logit_normal"
  timestep_shift: 1.0
  timestep_weighting: "none"
  loss_weight_fn: "constant"
  loss_weight_strength: 5.0
  vb_loss_strength: 1.0
  do_differential_guidance: true
  differential_guidance_scale: 3.0
  unconditional_prompt: ""
  dynamic_noise_offset: true
  noise_multiplier: 1.0
  random_noise_multiplier: 0.0
  random_noise_shift: 0.0
  latent_multiplier: 1.0
  noisy_latent_multiplier: 1.0
  max_grad_norm: 1.0
  save_every: 500

# Output configuration
output:
  path: "./output/[person_to_train]"

# Logging configuration
logging:
  level: "INFO"

# Training settings
dtype: "bfloat16"
mixed_precision: "bf16"
seed: 42
