# MOSS-Image LoRA -- Automagic3 (train_moss_image_lora.py)
# Dataset: Felicia Day (23 images)
#
# The template's recipe (templates/moss_image_automagic_template.yaml) with the FLUX.3 v3 lessons: an 8-step
# sign window (16 left FLUX.3 under-trained at ~3e-5) and 2500 steps (~109 epochs). Same LoRA,
# timesteps and resolution as train_moss_image_feliciaday_prodigy.yaml, so the two compare directly.
#
#   python train_moss_image_lora.py --config config/train_moss_image_feliciaday_automagic3.yaml

model:
  # Adjust if the files sit elsewhere under ComfyUI\models.
  transformer_path: "C:\\Development\\ComfyUI\\models\\diffusion_models\\MOSS\\moss_image_base_bf16.safetensors"
  vae_path: "C:\\Development\\ComfyUI\\models\\vae\\flux2_vae.safetensors"
  text_encoder_path: "C:\\Development\\ComfyUI\\models\\text_encoders\\qwen3.5_9b_int8_convrot.safetensors"

dataset:
  path: "C:\\Development\\ai-toolkit\\datasets\\feliciaday"
  resolution: 512            # area target; buckets keep each image's aspect on a 16 px grid
  aspect_mode: "bucket"
  trigger: "feliciaday"
  default_caption: "a photo of feliciaday"   # only for images without a .txt caption
  repeats: 1

lora:
  rank: 16
  alpha: 16
  prefix: "diffusion_model."
  # blocks (attention + feed-forward of the 42 joint blocks = 252) | attn (attention only = 168)
  # | all (blocks + the 2 text-embedder blocks + input/timestep/modulation/output = 269)
  targets: "blocks"
  dtype: "float32"

train:
  batch_size: 1
  gradient_accumulation_steps: 1
  # Duration: max_steps (> 0) wins; otherwise num_epochs full epochs.
  # max_steps: 2500
  num_epochs: 100
  save_every: 250
  # The report's last pretraining interval: logit(sigma) ~ N(1.09, 0.95), truncated at sigma 0.95
  # and rescaled onto the 1000-step grid, 1 % uniform, no shift. Mean sigma ~0.74; only ~2 % of
  # steps land below sigma 0.3. For more fine detail, try timestep_logit_mean 0.
  timestep_distribution: "logit_normal"
  timestep_logit_mean: 1.09
  timestep_logit_std: 0.95
  timestep_cutoff: 0.95
  timestep_uniform_mix: 0.01
  timestep_shift: 1.0
  timestep_grid: 1000
  max_grad_norm: 1.0
  gradient_checkpointing: true
  int8_grad_precision: "bf16"     # only for an int8 DiT: backward through its Linears, bf16 | fp32 | int8
  optimizer: "automagic3"
  learning_rate: 1.0e-6           # Automagic3 launch point; it adapts from here
  weight_decay: 0.0
  automagic_param_groups: true    # attention / MLP / other each adapt their own rate
  automagic_polarity_history: 8
  automagic_clip_threshold: 1.0
  automagic_beta2: 0.999
  automagic_eps: 1.0e-30
  ema_decay: 0.98                 # checkpoints save the average
  # The reference sampler uses real CFG (scale 3) against the empty prompt; dropping a caption
  # now and then keeps the LoRA's unconditional branch in step.
  caption_dropout: 0.05

dtype: "bfloat16"
mixed_precision: "bf16"
seed: 42

output:
  path: "./output/moss_image_feliciaday_automagic3"
  name: "moss_image_feliciaday_v1_automagic3"
  dtype: "bfloat16"
  embed_config: true

logging:
  level: "INFO"
