# Qwen-Image-2.1 LoRA Training Configuration - Prodigy Adaptive Optimizer
# Dataset: Felicia Day (23 images)

model:
  transformer_path: "C:\\Development\\ComfyUI\\models\\diffusion_models\\Qwen\\qwen_image_2.1_int8_convrot.safetensors"
  vae_path: "C:\\Development\\ComfyUI\\models\\vae\\qwen_image_2.1_vae_bf16.safetensors"
  text_encoder_path: "C:\\Development\\ComfyUI\\models\\text_encoders\\qwen3vl_8b_int8_convrot.safetensors"

dataset:
  path: "C:\\Development\\ai-toolkit\\datasets\\feliciaday"
  resolution: 512
  trigger: "feliciaday"
  default_caption: "a photo of feliciaday"
  repeats: 1
  num_workers: 0

lora:
  rank: 16
  alpha: 16
  prefix: "diffusion_model."
  target_modules: ["to_q", "to_k", "to_v", "to_out.0", "gate_up", "img_mlp.out"]
  dtype: "float32"

train:
  batch_size: 1
  gradient_accumulation_steps: 1
  num_epochs: 100
  optimizer: "prodigy"
  learning_rate: 1.0         # Prodigy multiplier
  weight_decay: 0.01
  prodigy_d_coef: 1.0        # Step size scale (1.0 default, 2.0 for faster convergence)
  prodigy_d0: 1.0e-6         # Initial step size guess
  prodigy_beta2: 0.99
  prodigy_decouple: true
  prodigy_use_bias_correction: true
  timestep_distribution: "shift"
  sigmoid_scale: 1.0
  loss_weight_strength: 1.0
  max_grad_norm: 1.0
  save_every: 250

dtype: "bfloat16"
mixed_precision: "bf16"
seed: 42

output:
  path: "./output/qwen21_feliciaday_prodigy"
  name: "qwen21_feliciaday_v1_prodigy"
  format: "diffusers"
  dtype: "bfloat16"
  embed_config: true

logging:
  level: "INFO"
