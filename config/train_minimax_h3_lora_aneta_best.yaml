# MiniMax H3 LoRA Training Configuration (Borrowed from AI-Toolkit Wan Template)

model:
  transformer_path: "C:\\Development\\ComfyUI\\models\\diffusion_models\\MinimaxH3\\minimax_h3_fl2va_pruned_int8_convrot.safetensors"
  vae_path: "C:\\Development\\ComfyUI\\models\\vae\\minimax_h3_video_vae_fp16.safetensors"
  text_encoder_path: "C:\\Development\\ComfyUI\\models\\text_encoders\\qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors"

dataset:
  path: "C:\\Development\\trainers\\maltrainer\\datasets\\aneta"
  resolution: 512
  trigger: "aneta"
  default_caption: "a photo of aneta"
  repeats: 1
  num_workers: 0

lora:
  rank: 32
  alpha: 32
  prefix: "diffusion_model."
  target_modules: ["qkv_proj", "out_proj", "fc1", "fc2"]

train:
  batch_size: 1
  gradient_accumulation_steps: 1
  num_epochs: 110
  optimizer: "adamw8bit"
  learning_rate: 1.0e-4
  weight_decay: 0.0001
  # timestep_shift 12.0 is H3's VIDEO flow shift. On stills it put ~57% of samples above
  # sigma 0.9 and only ~8% below 0.5, so nearly all training landed in the high-noise range
  # that sets composition rather than the low-noise range where facial identity resolves.
  # That is the likeness ceiling we kept hitting.
  #
  # krea2_shift derives the shift from the packed token count instead, matching
  # musubi-tuner's image-only H3 recipe (~1.65 at 512px, ~1.79 at 1024px) over a
  # logit-normal base. ~31% of samples then fall below sigma 0.5 -- about 4x more
  # low-noise training. timestep_shift is used only by "uniform" / "logit_normal".
  timestep_distribution: "krea2_shift"
  sigmoid_scale: 1.0
  timestep_shift: 12.0
  loss_weight_strength: 1.0
  do_differential_guidance: false
  max_grad_norm: 1.0
  save_every: 250

dtype: "bfloat16"
mixed_precision: "bf16"
seed: 42

output:
  path: "./output/minimax_h3_lora"

logging:
  level: "INFO"
