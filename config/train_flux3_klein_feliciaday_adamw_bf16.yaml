# FLUX.3 [klein] LoRA -- AdamW 8-bit on the bf16 base, after Fizgig 8.1's "Flux 3 Standard" preset
# Dataset: Felicia Day (23 images)
#
# Fizgig 8.1 (families/flux3.py) trains Flux 3 with Krea 2's settings: adamw8bit at a flat 1e-4,
# rank 32, EMA 0.98, 0.25 MP, 64 epochs. Our first Automagic3 run plateaued at ~3e-5, 3x lower.
# Fizgig also trains on the bf16 base file, not the int8 one, and measured 0.31 s/step at 0.25 MP
# on a 5090 (our int8 run: 0.72 s/step). Its int8 is a requantization of its own; it refuses the
# Comfy int8 file.
#
# Needs diffusion_models/flux3_image_klein_bf16.safetensors (11.1 GB) from
# black-forest-labs/flux-3-image-klein-comfy. To stay on the int8 file, change transformer_path.
# 64 epochs x 23 images = 1472 steps.
#
#   python train_flux3_klein_lora.py --config config/train_flux3_klein_feliciaday_adamw_bf16.yaml

model:
  transformer_path: "C:\\Development\\ComfyUI\\models\\diffusion_models\\FLUX3\\flux3_image_klein_bf16.safetensors"
  vae_path: "C:\\Development\\ComfyUI\\models\\vae\\flux2_vae.safetensors"
  text_encoder_path: "C:\\Development\\ComfyUI\\models\\text_encoders\\qwen3vl_4b_int8_convrot.safetensors"

dataset:
  path: "C:\\Development\\ai-toolkit\\datasets\\feliciaday"
  resolution: 512            # 0.26 MP, Fizgig's 0.25 MP
  aspect_mode: "bucket"
  trigger: "feliciaday"
  default_caption: "a photo of feliciaday"
  repeats: 1

lora:
  rank: 32                   # Fizgig Standard
  alpha: 32
  prefix: "diffusion_model."
  targets: "blocks"          # Fizgig trains the same six Linears of every block
  dtype: "float32"

train:
  batch_size: 1
  gradient_accumulation_steps: 1
  max_steps: 0               # 0 = train num_epochs full epochs
  num_epochs: 64
  save_every: 250
  timestep_distribution: "uniform"
  timestep_shift: 6.93
  max_grad_norm: 1.0
  gradient_checkpointing: true
  optimizer: "adamw8bit"
  learning_rate: 1.0e-4
  weight_decay: 0.01
  ema_decay: 0.98            # Fizgig's default for Flux 3
  caption_dropout: 0.05

dtype: "bfloat16"
mixed_precision: "bf16"
seed: 42

output:
  path: "./output/flux3_klein_feliciaday_adamw_bf16"
  name: "flux3_klein_feliciaday_v4_adamw_bf16"
  dtype: "bfloat16"
  embed_config: true

logging:
  level: "INFO"
