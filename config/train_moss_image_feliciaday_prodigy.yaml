# MOSS-Image LoRA -- Prodigy, 100 epochs (train_moss_image_lora.py)
# Dataset: Felicia Day (23 images)
#
# The Prodigy template (config/moss_image_prodigy_template.yaml), i.e. FLUX.3's Prodigy settings.
# 100 epochs x 23 images = 2300 steps; a checkpoint every 250 to find where likeness peaks.
#
#   python train_moss_image_lora.py --config config/train_moss_image_feliciaday_prodigy.yaml

model:
  # Adjust if the files sit elsewhere under ComfyUI\models.
  transformer_path: "C:\\Development\\ComfyUI\\models\\diffusion_models\\MOSS\\moss_image_base_bf16.safetensors"
  vae_path: "C:\\Development\\ComfyUI\\models\\vae\\flux2_vae.safetensors"
  text_encoder_path: "C:\\Development\\ComfyUI\\models\\text_encoders\\qwen3.5_9b_int8_convrot.safetensors"

dataset:
  path: "C:\\Development\\ai-toolkit\\datasets\\feliciaday"
  resolution: 512            # area target; buckets keep each image's aspect on a 16 px grid
  aspect_mode: "bucket"
  trigger: "feliciaday"
  default_caption: "a photo of feliciaday"   # only for images without a .txt caption
  repeats: 1

lora:
  rank: 16
  alpha: 16
  prefix: "diffusion_model."
  targets: "blocks"          # attention + feed-forward of the 42 joint blocks (252)
  dtype: "float32"

train:
  batch_size: 1
  gradient_accumulation_steps: 1
  max_steps: 0               # 0 = train num_epochs full epochs
  num_epochs: 100
  save_every: 250
  timestep_distribution: "logit_normal"   # the report's final pretraining interval, as in the Automagic3 template
  timestep_logit_mean: 1.09
  timestep_logit_std: 0.95
  timestep_cutoff: 0.95
  timestep_uniform_mix: 0.01
  timestep_shift: 1.0
  timestep_grid: 1000
  max_grad_norm: 1.0
  gradient_checkpointing: true
  int8_grad_precision: "bf16"
  optimizer: "prodigy"
  learning_rate: 1.0         # Prodigy's multiplier on its own estimated step size
  learning_rate_warmup_steps: 100
  weight_decay: 0.01
  adam_beta1: 0.9
  prodigy_beta2: 0.99
  prodigy_eps: 1.0e-8
  prodigy_d0: 1.0e-6         # initial step-size guess; Prodigy grows it
  prodigy_d_coef: 1.0        # raise (e.g. 2.0) if a run comes out under-trained
  prodigy_decouple: true
  prodigy_use_bias_correction: true
  prodigy_safeguard_warmup: true   # keeps the d estimate from overshooting during warmup
  ema_decay: 0.0
  caption_dropout: 0.05

dtype: "bfloat16"
mixed_precision: "bf16"
seed: 42

output:
  path: "./output/moss_image_feliciaday_prodigy"
  name: "moss_image_feliciaday_v1_prodigy"
  dtype: "bfloat16"
  embed_config: true

logging:
  level: "INFO"
