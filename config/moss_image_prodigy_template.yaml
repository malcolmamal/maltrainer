# MOSS-Image LoRA template -- Prodigy (train_moss_image_lora.py).
#
# Placeholders as in moss_image_template.yaml: [person_to_train], [comfyui_models].
#
# Same model files, LoRA, timesteps and resolution as the Automagic3 template, so the two compare
# directly. Prodigy settings are those of the FLUX.3 [klein] Prodigy run
# (train_flux3_klein_feliciaday_prodigy.yaml): lr 1.0 (a multiplier on Prodigy's own step-size
# estimate d), 100 warmup steps, decoupled weight decay 0.01, beta2 0.99, bias correction and
# safeguarded warmup on, no EMA (Prodigy's step size does the smoothing).
# 100 epochs; on Qwen-Image 2.1 Prodigy overcooked past ~1500 steps, so compare checkpoints.

model:
  transformer_path: "[comfyui_models]/diffusion_models/moss_image_base_bf16.safetensors"
  vae_path: "[comfyui_models]/vae/flux2_vae.safetensors"
  text_encoder_path: "[comfyui_models]/text_encoders/qwen3.5_9b_int8_convrot.safetensors"

dataset:
  path: "datasets/[person_to_train]"
  resolution: 512
  aspect_mode: "bucket"
  trigger: "[person_to_train]"
  default_caption: "a photo of [person_to_train]"
  repeats: 1

lora:
  rank: 16
  alpha: 16
  prefix: "diffusion_model."
  targets: "blocks"          # attention + feed-forward of the 42 joint blocks (252)
  dtype: "float32"

train:
  batch_size: 1
  gradient_accumulation_steps: 1
  max_steps: 0               # 0 = train num_epochs full epochs
  num_epochs: 100
  save_every: 250
  timestep_distribution: "logit_normal"   # the report's final pretraining interval, as in the Automagic3 template
  timestep_logit_mean: 1.09
  timestep_logit_std: 0.95
  timestep_cutoff: 0.95
  timestep_uniform_mix: 0.01
  timestep_shift: 1.0
  timestep_grid: 1000
  max_grad_norm: 1.0
  gradient_checkpointing: true
  int8_grad_precision: "bf16"
  optimizer: "prodigy"
  learning_rate: 1.0         # Prodigy's multiplier on its own estimated step size
  learning_rate_warmup_steps: 100
  weight_decay: 0.01
  adam_beta1: 0.9
  prodigy_beta2: 0.99
  prodigy_eps: 1.0e-8
  prodigy_d0: 1.0e-6         # initial step-size guess; Prodigy grows it
  prodigy_d_coef: 1.0        # raise (e.g. 2.0) if a run comes out under-trained
  prodigy_decouple: true
  prodigy_use_bias_correction: true
  prodigy_safeguard_warmup: true   # keeps the d estimate from overshooting during warmup
  ema_decay: 0.0
  caption_dropout: 0.05

dtype: "bfloat16"
mixed_precision: "bf16"
seed: 42

output:
  path: "./output/moss_image/[person_to_train]"
  name: "moss_image_[person_to_train]_prodigy"
  dtype: "bfloat16"
  embed_config: true

logging:
  level: "INFO"
