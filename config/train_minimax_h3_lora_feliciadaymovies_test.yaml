# Short smoke test of MiniMax H3 audio+video training on the feliciadaymovies dataset.
# 2 epochs, a checkpoint every 25 steps, 1.6 s clips at 384 px: it checks the whole pipeline
# end to end (decode -> video + audio VAE -> text encoder -> training -> save) quickly.
# For a real run: num_epochs 50 (Fizgig's default), max_frames 73+, save_every 250.

model:
  transformer_path: "C:\\Development\\ComfyUI\\models\\diffusion_models\\MinimaxH3\\minimax_h3_fl2va_pruned_int8_convrot.safetensors"
  vae_path: "C:\\Development\\ComfyUI\\models\\vae\\minimax_h3_video_vae_fp16.safetensors"
  audio_vae_path: "C:\\Development\\ComfyUI\\models\\vae\\minimax_h3_audio_vae_fp32.safetensors"
  text_encoder_path: "C:\\Development\\ComfyUI\\models\\text_encoders\\qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors"
  training_adapter_path: "C:\\Development\\trainers\\minimax_h3_training_adapter_v1.safetensors"

dataset:
  path: "C:\\Development\\ai-toolkit\\datasets\\feliciadaymovies"
  media: ["image", "clip", "audio"]
  resolution: 512
  clip_resolution: 384
  aspect_mode: "bucket"
  max_frames: 39             # 1.6 s from the start of each clip
  long_media: "first"
  clip_audio: true
  trigger: "feliciaday"
  default_caption: "a video of feliciaday"
  repeats: 1

lora:
  rank: 16
  alpha: 16
  prefix: "diffusion_model."
  target_modules: ["qkv_proj", "out_proj", "fc1", "fc2"]
  block_range: [20, 49]
  include_token_refiner: false
  include_adaln: false
  dtype: "float32"

train:
  batch_size: 1
  gradient_accumulation_steps: 1
  num_epochs: 2
  optimizer: "automagic3"
  learning_rate: 1.0e-6
  weight_decay: 0.0
  timestep_distribution: "lownoise"
  lownoise_pct: 60
  ema_decay: 0.98
  caption_dropout: 0.05
  do_guidance_loss: false
  train_audio: true
  audio_loss_weight: 1.0
  pack_silent_audio: true
  max_grad_norm: 1.0
  save_every: 25

dtype: "bfloat16"
mixed_precision: "bf16"
seed: 42

output:
  path: "./output/minimax_h3_feliciadaymovies_test"

logging:
  level: "INFO"
