# Z-Image Textual Inversion Training Configuration Example

# Model configuration
model:
  name_or_path: "Tongyi-MAI/Z-Image"  # or path to local model

# Embedding configuration
embedding:
  trigger: "sks"  # Your trigger token
  num_vectors: 1  # Number of vectors to learn (1-4 typical)
  init_text: "a photo"  # Text to initialize embeddings

# Dataset configuration
dataset:
  path: "/path/to/your/dataset"
  resolution: 512
  center_crop: true
  random_flip: false
  num_workers: 4

# Training configuration
train:
  batch_size: 1
  gradient_accumulation_steps: 4
  num_epochs: 100  # Embeddings typically need more epochs
  learning_rate: 5e-4  # Higher LR for embeddings
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1e-8
  weight_decay: 0.01
  max_grad_norm: 1.0
  save_every: 500

# Output configuration
output:
  path: "./output/zimage_embedding"

# Logging configuration
logging:
  level: "INFO"

# Training settings
dtype: "bfloat16"
mixed_precision: "bf16"
seed: 42
