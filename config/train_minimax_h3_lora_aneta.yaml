# MiniMax H3 LoRA Training Configuration Example

model:
  transformer_path: "C:\\Development\\ComfyUI\\models\\diffusion_models\\MinimaxH3\\minimax_h3_fl2va_pruned_int8_convrot.safetensors"
  vae_path: "C:\\Development\\ComfyUI\\models\\vae\\minimax_h3_video_vae_fp16.safetensors"
  text_encoder_path: "C:\\Development\\ComfyUI\\models\\text_encoders\\qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors"

dataset:
  path: "C:\\Development\\trainers\\maltrainer\\datasets\\aneta"
  resolution: 512
  trigger: "aneta"
  default_caption: "a photo of aneta"
  repeats: 1
  num_workers: 0

lora:
  rank: 64
  alpha: 64
  prefix: "diffusion_model."
  target_modules: ["qkv_proj", "out_proj", "fc1", "fc2"]

train:
  batch_size: 1
  gradient_accumulation_steps: 2
  num_epochs: 130
  optimizer: "adamw8bit"
  # 1e-4 left the subject undertrained at 1560 steps / 23 images. Doubled rather than
  # pushed harder: past ~3e-4 at rank 64 with alpha scale 1.0 the LoRA starts trading
  # likeness for texture damage, which looks like the artifacts we just removed.
  learning_rate: 2.0e-4
  # 200 warmup steps was 13% of the run (~17 epochs) spent below target LR.
  learning_rate_warmup_steps: 100
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1e-8
  weight_decay: 0.01
  # H3's own schedule is already heavily high-noise weighted: uniform t through
  # timestep_shift=12 puts ~92% of samples at sigma>0.5. Stacking logit_normal on top of
  # that pushes it to ~99% and starves the low-noise/detail range. "uniform" here equals
  # musubi-tuner's timestep_sampling="shift", which is the reference H3 recipe.
  timestep_distribution: "uniform"
  timestep_shift: 12.0
  loss_weight_strength: 1.0
  do_differential_guidance: false
  max_grad_norm: 1.0
  # Backward precision through the frozen INT8 ConvRot layers. bf16 matches musubi-tuner
  # and is ~2x faster than fp32; fp32 is the most accurate; int8 is fastest but re-quantizes
  # the gradient in all 50 blocks, which is what produced noisy LoRAs before.
  int8_grad_precision: "bf16"
  save_every: 300

dtype: "bfloat16"
mixed_precision: "bf16"
seed: 42

output:
  path: "./output/minimax_h3_lora"

logging:
  level: "INFO"
