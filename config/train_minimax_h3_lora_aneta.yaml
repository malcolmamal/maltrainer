# MiniMax H3 LoRA Training Configuration Example (Prodigy Optimizer, Rank 32)

model:
  transformer_path: "C:\\Development\\ComfyUI\\models\\diffusion_models\\MinimaxH3\\minimax_h3_fl2va_pruned_int8_convrot.safetensors"
  vae_path: "C:\\Development\\ComfyUI\\models\\vae\\minimax_h3_video_vae_fp16.safetensors"
  text_encoder_path: "C:\\Development\\ComfyUI\\models\\text_encoders\\qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors"
  # Ostris de-distillation ("training") adapter: a frozen rank-16 LoRA kept live during
  # training and absent at inference, so the trainable LoRA learns under deployment-like
  # conditions. Its keys already match this trainer's naming exactly (416 tensors = the same
  # 208 modules). Reported to stack well with contrastive guidance. Remove to disable.
  training_adapter_path: "C:\\Development\\trainers\\minimax_h3_training_adapter_v1.safetensors"

dataset:
  path: "C:\\Development\\trainers\\maltrainer\\datasets\\aneta"
  resolution: 512
  trigger: "aneta"
  default_caption: "a photo of aneta"
  repeats: 1
  num_workers: 0

lora:
  rank: 32
  alpha: 32
  prefix: "diffusion_model."
  target_modules: ["qkv_proj", "out_proj", "fc1", "fc2"]
  # Per-block adaln_proj (NOT final_layer). false = 208 layers, true = 258, which matches the
  # module count Fizgig reports the reference trainer using on this checkpoint.
  # On the PRUNED build adaln_proj is [96768, 8]: small, kept by ComfyUI's inference build, and
  # the timestep-conditioned modulation -- Fizgig found that excluding it presents from outside
  # as "the mid/low-noise range never trains". (On the FULL bf16 model it is [96768, 2688] and
  # should stay excluded: it would soak up most of the capacity for weights inference discards.)
  # We use the pruned checkpoint, so true is worth an A/B.
  include_adaln: false

train:
  batch_size: 1
  gradient_accumulation_steps: 1
  num_epochs: 140
  optimizer: "prodigy"
  learning_rate: 1.0        # Prodigy multiplier (>=0.01 is taken at face value)
  weight_decay: 0.01
  # --- Prodigy knobs. Only d_coef is set; the rest are shown at their defaults so they can
  # --- be swept one at a time. Unsupported keys are dropped with a warning, not a crash.
  # d_coef: multiplies the adapted rate. THE knob to try first. 1.0 = library default,
  #   2.0 = usual LoRA recommendation, 3.0-4.0 trains harder and eventually trades likeness
  #   for texture damage. Watch the "d" value in training.log.
  prodigy_d_coef: 2.0
  # prodigy_d0: 1.0e-6          # initial step-size guess; 1e-5/1e-4 shortens the ramp
  # prodigy_beta2: 0.99         # 0.999 is smoother/slower to react
  # prodigy_beta3: null         # EMA horizon for d; null -> sqrt(beta2)
  # prodigy_growth_rate: .inf   # cap d growth per step; 1.02 tames a spiking d
  # prodigy_eps: 1.0e-8
  # prodigy_decouple: true
  # prodigy_use_bias_correction: true
  # prodigy_safeguard_warmup: false   # auto-on when learning_rate_warmup_steps > 0
  #
  # krea2_shift vs uniform+12.0 is still an open question here: the best-likeness run so far
  # (see _best preset) paired adamw8bit with krea2_shift, while the preferred Prodigy run
  # used uniform+12.0 -- so optimizer and schedule were never varied independently. This
  # config changes only the schedule relative to that Prodigy run, isolating it.
  # "sigmoid" = UNSHIFTED logit-normal (sigma = sigmoid(N(0,1)), median 0.5), which the
  # r/StableDiffusion H3 thread flags as important for character LoRAs and which VrFrog and
  # Different_Fix_2217 both report working paired with contrastive guidance. Note Fizgig saw
  # unshifted densities overdrive adapters at 1e-4 -- but ran them WITHOUT contrastive
  # guidance, which changes the dynamics. Alternatives: "krea2_shift", "uniform", "logit_normal".
  timestep_distribution: "sigmoid"
  sigmoid_scale: 1.0
  timestep_shift: 12.0      # used only by "uniform" / "logit_normal"
  loss_weight_strength: 1.0
  # --- Contrastive guidance (ai-toolkit's do_guidance_loss; their H3 default) ---
  # H3 is guidance-distilled: CFG is baked in, so a plain flow target trains the conditional
  # direction too weakly and the distillation degrades as the LoRA takes hold. This runs a
  # second, gradient-free pass on the empty prompt and extrapolates the TARGET away from it:
  #   target' = uncond + scale * (target - uncond)
  # Costs roughly a second forward pass per step. ai-toolkit calls this the slower but more
  # durable of the two fixes; the training-adapter route is faster but degrades over long runs.
  do_guidance_loss: true
  guidance_loss_target: 3.5          # ai-toolkit's H3 default
  guidance_loss_schedule: "sigma"    # decay toward a plain target as sigma falls
  unconditional_prompt: ""
  # guidance_loss_cfg_zero: false    # CFG-Zero*: project uncond onto the conditional direction
  do_differential_guidance: false    # legacy alias for do_guidance_loss
  max_grad_norm: 1.0
  save_every: 250

dtype: "bfloat16"
mixed_precision: "bf16"
seed: 42

output:
  path: "./output/minimax_h3_lora"

logging:
  level: "INFO"
