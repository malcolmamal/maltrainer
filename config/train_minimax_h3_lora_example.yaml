# MiniMax H3 LoRA Training Configuration Example

model:
  transformer_path: "C:\\Development\\ComfyUI\\models\\diffusion_models\\MinimaxH3\\minimax_h3_fl2va_pruned_int8_convrot.safetensors"
  vae_path: "C:\\Development\\ComfyUI\\models\\vae\\minimax_h3_video_vae_fp16.safetensors"
  text_encoder_path: "C:\\Development\\ComfyUI\\models\\text_encoders\\qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors"

dataset:
  path: "C:\\Development\\trainers\\maltrainer\\datasets\\aneta"
  resolution: 512
  trigger: "aneta"
  default_caption: "a photo of aneta"
  repeats: 1
  num_workers: 0

lora:
  rank: 32
  alpha: 32
  prefix: "diffusion_model."
  target_modules: ["token_refiner", "fc1", "fc2"]

train:
  batch_size: 1
  gradient_accumulation_steps: 2
  num_epochs: 120
  optimizer: "adamw8bit"
  learning_rate: 3e-4
  learning_rate_warmup_steps: 200
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1e-8
  weight_decay: 0.01
  timestep_distribution: "logit_normal"
  timestep_logit_mean: 0.0
  timestep_logit_std: 1.0
  timestep_shift: 12.0
  loss_weight_strength: 5.0
  do_differential_guidance: false
  differential_guidance_scale: 3.0
  unconditional_prompt: ""
  max_grad_norm: 1.0
  save_every: 300

dtype: "bfloat16"
mixed_precision: "bf16"
seed: 42

output:
  path: "./output/minimax_h3_lora"

logging:
  level: "INFO"
