# Supra2-IMG full finetune. VAE and Flan-T5 stay frozen.
# Images are read from the dataset tree and resized to 256 in memory.
# The saved file is a base checkpoint: pass it to inference.py with --ckpt.

model:
  transformer_path: "C:\\Development\\projects\\huggingface\\Supra2-IMG\\Supra2-IMG_fp32.safetensors"
  vae_path: "C:\\Development\\projects\\huggingface\\Supra2-IMG\\sd-vae-ft-mse.safetensors"
  vae_config: "C:\\Development\\projects\\huggingface\\Supra2-IMG\\sd-vae-ft-mse.config.json"
  text_encoder_path: "C:\\Development\\projects\\huggingface\\Supra2-IMG\\flan-t5-base.safetensors"
  text_encoder_config: "C:\\Development\\projects\\huggingface\\Supra2-IMG\\flan-t5-base.config.json"
  tokenizer_path: "C:\\Development\\projects\\huggingface\\Supra2-IMG\\flan-t5-base.tokenizer.json"

dataset:
  path: "C:\\Development\\ai-toolkit\\datasets"
  resolution: 256
  repeats: 1
  num_workers: 0

train:
  mode: finetune
  batch_size: 1
  gradient_accumulation_steps: 1
  num_epochs: 1
  optimizer: "adamw8bit"
  learning_rate: 1.0e-5
  weight_decay: 0.01
  timestep_distribution: "uniform"
  caption_dropout: 0.1
  max_grad_norm: 1.0
  save_every: 500
  keep_last: 3
  # Continue after Ctrl+C by adding: --resume latest

sample:
  seed: 0
  cfg: 3.0
  steps: 50
  man: "a portrait photo of a man's face"
  woman: "a portrait photo of a woman's face"

dtype: "bfloat16"
mixed_precision: "bf16"
seed: 42

output:
  path: "./output/supra2_img_finetune"
  name: "supra2_img_finetune"
  dtype: "float32"
  embed_config: true

logging:
  level: "INFO"
