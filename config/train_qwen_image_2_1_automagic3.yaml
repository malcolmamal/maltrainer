# Qwen-Image-2.1 LoRA Training Configuration - Automagic v3 Optimizer Template

model:
  transformer_path: "C:\\Development\\ComfyUI\\models\\diffusion_models\\Qwen\\qwen_image_2.1_int8_convrot.safetensors"
  vae_path: "C:\\Development\\ComfyUI\\models\\vae\\qwen_image_2.1_vae_bf16.safetensors"
  text_encoder_path: "C:\\Development\\ComfyUI\\models\\text_encoders\\qwen3vl_8b_int8_convrot.safetensors"

dataset:
  path: "datasets/my_subject"
  resolution: 512
  trigger: "my_subject"
  default_caption: "a photo of my_subject"
  repeats: 1
  num_workers: 0

lora:
  rank: 16
  alpha: 16
  prefix: "diffusion_model."
  target_modules: ["to_q", "to_k", "to_v", "to_out.0", "gate_up", "img_mlp.out"]
  dtype: "float32"

train:
  batch_size: 1
  gradient_accumulation_steps: 1
  num_epochs: 100
  optimizer: "automagic3"
  learning_rate: 1.0e-6        # Launch/start point (Automagic3 adapts rate dynamically)
  automagic_polarity_history: 8 # Sign-history window length H (2-64, default 8)
  automagic_clip_threshold: 1.0 # Trust region update RMS clamp
  automagic_beta2: 0.999
  automagic_eps: 1.0e-30
  weight_decay: 0.01
  timestep_distribution: "shift"
  sigmoid_scale: 1.0
  loss_weight_strength: 1.0
  max_grad_norm: 1.0
  save_every: 250

dtype: "bfloat16"
mixed_precision: "bf16"
seed: 42

output:
  path: "./output/qwen_image_2_1_automagic3"
  name: "qwen_image_2_1_lora_automagic3"
  format: "diffusers"
  dtype: "bfloat16"
  embed_config: true

logging:
  level: "INFO"
