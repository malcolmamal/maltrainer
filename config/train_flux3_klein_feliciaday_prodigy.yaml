# FLUX.3 [klein] LoRA -- Prodigy, 100 epochs (train_flux3_klein_lora.py)
# Dataset: Felicia Day (23 images)
#
# Second run: the Automagic3 run (train_flux3_klein_feliciaday.yaml) came out under-trained.
# Only the optimizer and duration change; LoRA targets, timesteps and resolution stay the same,
# so the two runs compare directly. EMA is off: Prodigy's own step size does the smoothing.
# 100 epochs x 23 images = 2300 steps; a checkpoint every 250 to find where likeness peaks
# (on Qwen-Image 2.1, Prodigy overcooked past ~1500 steps).
#
#   python train_flux3_klein_lora.py --config config/train_flux3_klein_feliciaday_prodigy.yaml

model:
  transformer_path: "C:\\Development\\ComfyUI\\models\\diffusion_models\\FLUX3\\flux3_image_klein_int8_convrot.safetensors"
  vae_path: "C:\\Development\\ComfyUI\\models\\vae\\flux2_vae.safetensors"
  text_encoder_path: "C:\\Development\\ComfyUI\\models\\text_encoders\\qwen3vl_4b_int8_convrot.safetensors"

dataset:
  path: "C:\\Development\\ai-toolkit\\datasets\\feliciaday"
  resolution: 512
  aspect_mode: "bucket"
  trigger: "feliciaday"
  default_caption: "a photo of feliciaday"
  repeats: 1

lora:
  rank: 16
  alpha: 16
  prefix: "diffusion_model."
  targets: "blocks"
  dtype: "float32"

train:
  batch_size: 1
  gradient_accumulation_steps: 1
  max_steps: 0               # 0 = train num_epochs full epochs
  num_epochs: 100
  save_every: 250
  timestep_distribution: "uniform"
  timestep_shift: 6.93
  max_grad_norm: 1.0
  gradient_checkpointing: true
  int8_grad_precision: "bf16"
  optimizer: "prodigy"
  learning_rate: 1.0         # Prodigy's multiplier on its own estimated step size
  learning_rate_warmup_steps: 100
  weight_decay: 0.01
  adam_beta1: 0.9
  prodigy_beta2: 0.99
  prodigy_eps: 1.0e-8
  prodigy_d0: 1.0e-6         # initial step-size guess; Prodigy grows it
  prodigy_d_coef: 1.0        # raise (e.g. 2.0) if this run is still under-trained
  prodigy_decouple: true
  prodigy_use_bias_correction: true
  prodigy_safeguard_warmup: true   # keeps the d estimate from overshooting during warmup
  ema_decay: 0.0
  caption_dropout: 0.05

dtype: "bfloat16"
mixed_precision: "bf16"
seed: 42

output:
  path: "./output/flux3_klein_feliciaday_prodigy"
  name: "flux3_klein_feliciaday_v2_prodigy"
  dtype: "bfloat16"
  embed_config: true

logging:
  level: "INFO"
