# Fibo 2.0 (Dev) LoRA template -- Automagic3 (train_fibo2_lora.py).
#
# Used by the web UI, which fills in the placeholders:
#   [person_to_train]   dataset folder name (also the default trigger word)
#   [comfyui_models]    COMFYUI_MODELS_PATH; the UI finds each file anywhere under the matching subfolder
# For the CLI, copy this file and replace the placeholders yourself.
#
# Recipe sources (docs/fibo2-lora-training.md):
#   BRIA's fine_tuning/train_lora.py -- the Dev model, rank 64, timesteps sigmoid(N(shift, 1)) with the shift
#     rising with the token count (10 % uniform), a null-caption dropout of 0.1
#   maltrainer's FLUX.3 Automagic3 setup -- one adaptive rate per module family, a 16-step sign window, no
#     weight decay, EMA 0.98, 1e-6 launch point

model:
  # The Dev model (full, not distilled). Edit Turbo is distilled and refused by the trainer.
  transformer_path: "[comfyui_models]/diffusion_models/Fibo2/fibo2_dev_bf16.safetensors"
  vae_path: "[comfyui_models]/vae/flux2_vae.safetensors"
  # Qwen3-VL-4B-Instruct, the same file FLUX.3 uses
  text_encoder_path: "[comfyui_models]/text_encoders/qwen3vl_4b_int8_convrot.safetensors"

dataset:
  path: "datasets/[person_to_train]"
  resolution: 1024           # area target (the model's training size); 768 or 512 are faster and lighter
  aspect_mode: "bucket"      # buckets keep each image's aspect on a 16 px grid
  trigger: "[person_to_train]"
  default_caption: "a photo of [person_to_train]"
  repeats: 1

lora:
  rank: 16
  alpha: 16
  prefix: "diffusion_model."
  # blocks (attention, SwiGLU and the injection blocks' cross-attention of the 2 refiner and 44 main blocks = 199)
  # | main (the 44 main blocks only = 191) | all (blocks + Perceiver, adaLN, input/timestep/output)
  targets: "blocks"
  dtype: "float32"

train:
  batch_size: 1
  gradient_accumulation_steps: 1
  # Duration: max_steps (> 0) wins; otherwise num_epochs full epochs.
  max_steps: 1500
  num_epochs: 70
  save_every: 250
  # bria (BRIA's recipe) | uniform | logit_normal; timestep_shift 1 leaves the draw as it is
  timestep_distribution: "bria"
  timestep_shift: 1.0
  max_grad_norm: 1.0
  gradient_checkpointing: true
  optimizer: "automagic3"
  learning_rate: 1.0e-6           # Automagic3 launch point; it adapts from here
  weight_decay: 0.0
  automagic_param_groups: true    # attention / MLP / other each adapt their own rate
  automagic_polarity_history: 16
  automagic_clip_threshold: 1.0
  automagic_beta2: 0.999
  automagic_eps: 1.0e-30
  ema_decay: 0.98                 # checkpoints save the average
  # An empty caption encodes as the null caption the model's CFG negative uses (BRIA drops 0.1).
  caption_dropout: 0.1

# Preview keys while it trains (console only): w renders "photo of a woman", m "photo of a man", g all of them,
# into <output>/samples/. Training waits while it renders. Delete this section to switch the keys off.
sample:
  keys: {w: "photo of a woman", m: "photo of a man"}
  prompts: []   # more prompts for g only, e.g. ["a woman reading in a cafe"] (saved as p1, p2 ...)
  steps: 30
  guidance: 5.0
  resolution: 1024
  seed: 42
  ema: true

dtype: "bfloat16"
mixed_precision: "bf16"
seed: 42

output:
  path: "./output/fibo2/[person_to_train]"
  name: "fibo2_[person_to_train]"
  dtype: "bfloat16"
  embed_config: true

logging:
  level: "INFO"
