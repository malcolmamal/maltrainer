# MiniMax H3 Image LoRA -- Fizgig's defaults (Standard preset), on maltrainer.
#
# H3 Image is NOT MiniMax H3 (the audio/video model): the same layers, but no audio stream, a distilled 6-step
# schedule with one output head per step, and weights that moved far from H3's. LoRAs and training adapters made
# for H3 do not carry over. See docs/minimax-h3-image-lora-training.md.
#
#   Automagic3 from 2.8e-4 . rank 8 on all 50 blocks (refiner frozen) . ~0.5 MP aspect buckets . EMA 0.98
#   the checkpoint's own 6 noise levels, each through its own head . likeness optimization . 30 epochs
#   Fizgig's training adapter, frozen at 1.0 (without it, people trained on this model turn into caricatures)

model:
  transformer_path: "C:\\Development\\ComfyUI\\models\\diffusion_models\\MinimaxH3Image\\minimax_h3_image_pruned_int8_convrot.safetensors"
  vae_path: "C:\\Development\\ComfyUI\\models\\vae\\minimax_h3_image_vae_fp16.safetensors"
  # H3's text encoder, unchanged
  text_encoder_path: "C:\\Development\\ComfyUI\\models\\text_encoders\\qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors"
  # https://huggingface.co/ShootTheSound/Fizgig-MiniMax-H3-Image-Training-Adapter (rank 16, 0.15 GB)
  training_adapter_path: "C:\\Development\\trainers\\fizgig_minimax_h3_image_training_adapter.safetensors"

dataset:
  path: "datasets/my_subject"
  resolution: 704            # ~0.5 MP (704 x 704); buckets keep each photo's aspect ratio on a 32 px grid
  aspect_mode: "bucket"
  trigger: "my_subject"
  default_caption: "a photo of my_subject"
  repeats: 1

lora:
  rank: 8
  alpha: 8
  prefix: "diffusion_model."
  target_modules: ["qkv_proj", "out_proj", "fc1", "fc2"]
  include_token_refiner: false   # training the refiner softens output
  include_adaln: false
  dtype: "float32"
  training_adapter_multiplier: 1.0

train:
  batch_size: 1
  gradient_accumulation_steps: 1
  num_epochs: 30
  optimizer: "automagic3"
  learning_rate: 2.8e-4      # Automagic3 keeps roughly the level it starts from, so this start is a real choice
  weight_decay: 0.0
  likeness_opt: true         # 75 % of steps at the clean end for 8 epochs, then 50 / 75 in turn; false = even draw
  ema_decay: 0.98            # checkpoints save the averaged weights
  caption_dropout: 0.05
  max_grad_norm: 1.0
  save_every: 0              # only the final file

dtype: "bfloat16"
mixed_precision: "bf16"
seed: 42

output:
  path: "./output/minimax_h3_image_lora"

logging:
  level: "INFO"
