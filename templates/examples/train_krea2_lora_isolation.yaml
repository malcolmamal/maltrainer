# Krea 2 LoRA of several people, with masks and DOP -- Fizgig LoRA Isolation (train_krea2_lora.py).
#
# Edit the paths, then:  python train_krea2_lora.py --config templates/examples/train_krea2_lora_isolation.yaml
# Guide: docs/krea2-lora-training.md ("Several subjects in one LoRA", "Masked training").
#
# Fizgig's recipe for its Krea 2 isolation results: rank 16, AdamW at 2e-4, constant, EMA 0.98, 0.25 MP, batch 1.
# AdamW, not Automagic3: the side-by-sides' higher rate needs an optimizer with one rate to scale.

model:
  transformer_path: "C:/ComfyUI/models/diffusion_models/krea2_raw_fp8_scaled.safetensors"
  vae_path: "C:/ComfyUI/models/vae/qwen_image_vae.safetensors"
  text_encoder_path: "C:/ComfyUI/models/text_encoders/qwen3vl_4b_fp8_scaled.safetensors"

dataset:
  path: "datasets/zwxem"      # the first subject's folder (isolation.subjects below names them all)
  resolution: 512             # Fizgig tested 0.25 MP (496 x 496)
  aspect_mode: "bucket"
  default_caption: ""
  repeats: 1

# One to four subjects, each in a folder of its own with its own trigger. Caption every picture
# "<trigger>, a <class>, ..." (zwxem, a woman smiling in a park); the trigger is read joined to the class
# (zwxemwoman) and the files on disk are never changed. Describe other people in a picture plainly, and use two
# triggers when two subjects share a picture. Trigger tips: made-up words, a different first letter each, ending
# in a consonant (dlor, gwelt, jeskv, knurv, vorlk, thrisk, zwxem).
isolation:
  subjects:
    - path: "datasets/zwxem"
      trigger: "zwxem"
      # what: "woman"         # when the captions never say what the subject is (woman, man, dog ...)
      # kind: "person"        # auto | person | thing | style (a style keeps its trigger as written)
    - path: "datasets/qrxt"
      trigger: "qrxt"
  fuse_triggers: true         # false: read the captions as written; as_written: true: they hold the joined word
  balance: true               # smaller folders repeat so each subject trains about as often as the largest
  side_by_side:
    enabled: false            # a subject's photo next to a stranger, two to a frame; people only
    # strangers_path: "C:/path/to/multi_person_strangers"   # a folder with strangers.json + pictures
    # (Fizgig's set: huggingface.co/datasets/ShootTheSound/fizgig-multi-person-strangers)
    per_subject: 16
    lr_boost: 2.0             # their steps train at this multiple of the rate (adamw / adamw8bit / muon)

# Train on the part of each picture that matters: photo.jpg with photo-masklabel.png beside it (white trains fully,
# black at the floor). A picture without a usable mask trains whole. Fizgig's masks work as they are.
masks:
  enabled: false
  floor: 0.1                  # how much outside the mask counts
  prior: 0.0                  # > 0: outside the mask the LoRA is held to the base model's own picture (one extra pass)

lora:
  rank: 16
  alpha: 16
  prefix: "diffusion_model."
  targets: "all"
  dtype: "float32"

train:
  batch_size: 1
  gradient_accumulation_steps: 1
  max_steps: 0
  num_epochs: 20              # two subjects of one kind (two women) want about 1.6x the epochs of a mixed pair
  save_every: 0
  timestep_distribution: "krea2_shift"
  max_grad_norm: 1.0
  optimizer: "adamw"
  learning_rate: 2.0e-4       # constant
  weight_decay: 0.0
  ema_decay: 0.98
  caption_dropout: 0.05
  # DOP for every subject at once: each joined word is swapped for its class phrase ("a woman") in a second,
  # trigger-free pass held to the base model. Isolation turns it on at Fizgig's setting (every second step, weight 2)
  # unless you say otherwise here.
  dop: true
  dop_every: 2
  dop_multiplier: 2.0

dtype: "bfloat16"
mixed_precision: "bf16"
seed: 42

output:
  path: "./output/krea2/isolation"
  name: "krea2_isolation"
  dtype: "bfloat16"
  embed_config: true

logging:
  level: "INFO"
