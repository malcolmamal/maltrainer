# The quality gate on every push and pull request: the same command as `quality.sh` locally,
# so what CI enforces and what runs before a push are the same thing.
name: quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true

      # CPU torch: the tests need no GPU, and the CUDA wheels are several GB.
      - name: Install dependencies
        run: uv sync --frozen --extra cpu --group dev --python 3.12

      - name: Quality gate
        run: uv run --frozen --extra cpu python -m maltrainer_quality --junit reports

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: reports/
          if-no-files-found: ignore
